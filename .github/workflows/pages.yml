name: Python documentation homepage to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["landing/**", "docs/**", "rtd_docs/docs_*/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["landing/**", "docs/**", "rtd_docs/docs_*/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"
  HUGO_SHA256: "a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Hugo release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.deb" | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build homepage
        run: hugo --source landing --minify --gc --panicOnWarning
      - name: Preserve generated API examples
        run: |
          mkdir -p landing/public/demo
          cp -R docs/. landing/public/demo/
          find docs -maxdepth 1 -type f ! -name index.html -exec cp -t landing/public {} +
          cp -R rtd_docs/docs_* landing/public/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: landing/public
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Deploy the built static site to Pages.
      id-token: write # Authenticate the Pages deployment through OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
